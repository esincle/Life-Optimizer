<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Life Optimizer{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="nav-brand">Life <span>Optimizer</span></a>
            <div class="nav-links">
                <a href="/today/" class="nav-link {% if request.path.startswith('/today') or request.path == '/' %}active{% endif %}">
                    Today
                </a>
                <a href="/tracker/" class="nav-link {% if request.path.startswith('/tracker') %}active{% endif %}">
                    Tracker
                </a>
                <a href="/journal/" class="nav-link {% if request.path.startswith('/journal') %}active{% endif %}">
                    Journal
                </a>
                <a href="/design/" class="nav-link {% if request.path.startswith('/design') %}active{% endif %}">
                    Design
                </a>
            </div>
            <span class="nav-date" id="nav-date"></span>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <div id="toast-container"></div>

    <script>
        // Display today's date in nav
        const d = new Date();
        document.getElementById('nav-date').textContent = d.toLocaleDateString('en-US', {
            weekday: 'short', month: 'short', day: 'numeric'
        });
    </script>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/reminders.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
